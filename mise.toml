[tools]
go = "1.27.3"
actionlint = "1.7.12"
zizmor = "1.31.1"
gitleaks = "8.30.1"
hk = "2.11.1"
pkl = "0.32.2"
taplo = "0.10.0"
"go:github.com/golangci/golangci-lint/v2/cmd/golangci-lint" = "v2.15.0"
"go:github.com/goreleaser/goreleaser/v2" = "v2.19.0"
"go:golang.org/x/tools/cmd/goimports" = "v0.52.0"
"go:golang.org/x/tools/gopls" = "v0.24.0"

[env]
HK_MISE = "1"

[hooks]
postinstall = "hk install --mise"

[tasks.fmt]
description = "Format Go sources (gofmt + goimports)"
run = "gofmt -s -w -r 'interface{} -> any' . && goimports -w ."

[tasks.lint]
description = "Run linters (CI parity)"
run = "mise run --force ci:lint"

[tasks.test]
description = "Run unit tests"
run = "mise run --force ci:test"

[tasks.leaks]
description = "Scan the full git history for leaked secrets"
run = "mise run --force ci:leaks"

[tasks.check]
description = "Run everything CI runs: build, lint, test, leak scan"
run = """
mise run ci:build
mise run ci:lint
mise run ci:test
mise run ci:leaks
"""

[tasks.hooks]
description = "Install git hooks via hk (mise-aware)"
run = "hk install --mise"

[tasks.pre-commit]
run = "hk run pre-commit"
