# Development environment for the ykgpg fish plugin.
#
# fish itself is NOT managed here: it comes from the system package manager
# (apt/PPA) or Homebrew, matching the plugin's supported floor (3.6+). CI
# installs its own fish per matrix entry (.github/workflows/ci.yml).
#
# Run `mise install` once, then:
#   mise run fmt      reformat fish sources
#   mise run lint     syntax + format checks + workflow/TOML lint
#   mise run test     fixture-based unit tests
#   mise run leak     autoload-leak regression test (fails on v1.0.0 baseline)
#   mise run check    everything above (what CI and the commit hook run)

[tools]
hk = "2.11.1"    # git hooks (jdx/hk); pin matches the schema in hk.pkl
actionlint = "1" # lints .github/workflows/ci.yml
taplo = "latest" # TOML lint/format for mise.toml itself

[tasks.fmt]
description = "Reformat all fish sources in place"
run = "fish_indent --write functions/*.fish completions/*.fish tests/*.fish"

[tasks.lint]
description = "Syntax-check fish files, verify formatting, lint workflows and TOML"
run = """
fish -n functions/ykgpg.fish completions/ykgpg.fish tests/test.fish
fish_indent --check functions/*.fish completions/*.fish tests/*.fish
actionlint
taplo format --check mise.toml
"""

[tasks.test]
description = "Run the pure-logic acceptance tests (no gpg, no hardware)"
run = "fish tests/test.fish"

[tasks.leak]
description = "Verify an interactive shell gains no handlers/globals from sourcing the plugin"
run = """
fish -i -c '
  source functions/ykgpg.fish
  if functions --handlers | grep -q ykgpg
      echo "LEAK: event handlers registered in interactive shell"; exit 1
  end
  if set | grep -qE "^(YKGPG_|_daily_home)"
      echo "LEAK: globals defined in interactive shell"; exit 1
  end
  echo "clean"
' </dev/null
"""

[tasks.check]
description = "Everything CI and the pre-commit hook run"
depends = ["lint", "test", "leak"]

[tasks.hooks]
description = "Install hk git hooks (mise-aware launcher)"
run = "hk install --mise"
